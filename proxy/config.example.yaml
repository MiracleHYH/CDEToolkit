# Public template: subscription URL is injected during installation.
# No ISP node, relay group, credential, or private endpoint is stored here.

allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: false

listeners:
  - name: common
    type: mixed
    port: 7890
    listen: 127.0.0.1
    proxy: common
    udp: true

proxy-providers:
  proxy_provider:
    type: http
    url: __SUBSCRIPTION_URL__
    path: ./providers/proxy_provider.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true

proxy-groups:
  - name: common
    type: url-test
    use:
      - proxy_provider
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true

rules:
  - MATCH,DIRECT
