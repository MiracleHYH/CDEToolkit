# Public ISP template: all private values are injected during installation.
# This template contains topology only, never a real subscription or ISP node.

allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: false

listeners:
  - name: common
    type: mixed
    port: 7890
    listen: 127.0.0.1
    proxy: common
    udp: true

  - name: isp
    type: mixed
    port: 7891
    listen: 127.0.0.1
    proxy: isp
    udp: true

proxy-providers:
  proxy_provider:
    type: http
    url: __SUBSCRIPTION_URL__
    path: ./providers/proxy_provider.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
      timeout: 5000
      lazy: true

proxies:
  - name: isp
    type: ss
    server: __ISP_SERVER__
    port: __ISP_PORT__
    cipher: __ISP_CIPHER__
    password: __ISP_PASSWORD__
    udp: true
    dialer-proxy: isp-relay

proxy-groups:
  - name: common
    type: url-test
    use:
      - proxy_provider
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true

  - name: isp-relay
    type: url-test
    use:
      - proxy_provider
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true

rules:
  - MATCH,DIRECT
