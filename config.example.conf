# Copy values into ~/.config/server-toolkit/config.conf or run: stk config setup
# This file intentionally contains no identity, credential, internal domain, or private endpoint.
schema_version=4
git_name=
git_email=
git_default_branch=main
codex_home=/home/USER/.codex
conda_envs_dir=/home/USER/.local/conda_envs
no_proxy=localhost,127.0.0.1,::1
proxy_common_listener=common
proxy_codex_listener=common
proxy_config_path=/home/USER/.config/server-toolkit/proxy.yaml
proxy_release_proxy=
github_key_path=/home/USER/.ssh/server-toolkit-github
github_key_source=
service_backend=auto
service_user=
self_update_policy=disabled
self_update_signers=
