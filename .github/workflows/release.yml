name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Check exact tag, source, packages and native executable
        env:
          NIDO_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go mod verify
          make release-check
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/public-audit.sh
      - name: Install signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign, verify and publish the checked Go packages
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/nido-linux-amd64.tar.gz dist/nido-linux-amd64.tar.gz.sha256 dist/install.sh)
          files=()
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            cosign verify-blob "$asset" --bundle "${asset}.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            files+=("$asset" "${asset}.sigstore.json")
          done
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes --latest
