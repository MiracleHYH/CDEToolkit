name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gds:
        description: Run historical Shell GDS tests (no CUDA or real GPU)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.23.x'
          - os: ubuntu-24.04
            go: '1.27.2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Check isolated fixtures and native release package
        run: make check smoke
      - name: Accept the local package API contract on native Linux amd64
        if: matrix.go == '1.27.2'
        run: |
          set -euo pipefail
          [[ $RUNNER_OS = Linux && $RUNNER_ARCH = X64 && $(uname -m) = x86_64 ]]
          evidence="$RUNNER_TEMP/nido-api-pre-release"
          mkdir "$evidence" "$evidence/fixture"
          version=$(cat VERSION)
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          image=docker.io/library/golang@sha256:2015125fe4a3d97f9ba4ad55d458c2d1f025fdf9cb73d8f423a29e448d59da5e
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -trimpath -buildvcs=false -o "$evidence/fixture/api-fixture" ./tests/fixtures/nido-api-release
          sha256sum dist/nido-linux-amd64.tar.gz dist/nido-linux-amd64.tar.gz.sha256 "$evidence/fixture/api-fixture" > "$evidence/inputs.sha256"
          docker pull --platform linux/amd64 "$image" > "$evidence/docker-pull.log" 2>&1
          docker image inspect "$image" > "$evidence/docker-image.json"
          jq -e 'length == 1 and .[0].Os == "linux" and .[0].Architecture == "amd64"' "$evidence/docker-image.json"
          NIDO_API_RELEASE_INPUT="$GITHUB_WORKSPACE/dist" \
          NIDO_API_RELEASE_FIXTURE="$evidence/fixture/api-fixture" \
          NIDO_API_RELEASE_OUTPUT="$evidence/contract" \
          NIDO_API_RELEASE_VERSION="$version" \
          NIDO_API_RELEASE_INPUT_SCOPE=pre-release-local \
          NIDO_API_RELEASE_IMAGE="$image" bash tests/nido-api-release-isolation.sh
      - name: Upload native local API contract evidence
        if: always() && matrix.go == '1.27.2'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nido-api-pre-release-${{ matrix.go }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nido-api-pre-release
          if-no-files-found: warn
          retention-days: 14

  public-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Audit source and history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/public-audit.sh

  gds-native:
    # Keep the full user/network namespace boundary without changing Ubuntu
    # 24.04's AppArmor policy. Ubuntu 22.04 remains available until 2027-04-17.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Prepare temporary runner tools and check ordinary user namespaces
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" -ne 0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --clearenv --cap-drop ALL \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev --tmpfs /tmp \
            /usr/bin/bash -euc '
              test "$(/usr/bin/id -u)" -ne 0
              test ! -e /dev/nvidiactl
              test ! -e /run
            '
      - name: Build native adapter without loading a GPU driver
        run: make build-gds
      - name: CPU protocol and fake driver isolation
        run: make check-gds
      - name: Reproducible standalone GDS release with fixed glibc baseline
        run: make gds-release gds-verify-release
      - name: Ordinary user native namespace isolation without GPU or network
        run: |
          GOPROXY=off GOSUMDB=off go mod vendor -o "$RUNNER_TEMP/gds-vendor"
          NIDO_TEST_GDS_VENDOR="$RUNNER_TEMP/gds-vendor" \
          NIDO_TEST_GDS_OUTPUT="$RUNNER_TEMP/gds-native-evidence" \
          make check-gds-linux-native GO="$(command -v go)"

  gds-legacy:
    if: github.event_name == 'workflow_dispatch' && inputs.gds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: make check-gds-legacy
