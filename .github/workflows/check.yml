name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gds:
        description: Run optional GDS isolation tests (no CUDA or real GPU)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            go: '1.23.x'
          - os: ubuntu-24.04
            go: '1.27.2'
          - os: macos-15
            go: '1.27.2'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - run: go mod verify
      - name: Check isolated fixtures and native release package
        run: make check smoke

  public-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Audit source and history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/public-audit.sh

  gds:
    if: github.event_name == 'workflow_dispatch' && inputs.gds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: make check-gds
