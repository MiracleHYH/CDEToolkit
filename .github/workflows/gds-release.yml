name: gds-release

on:
  push:
    tags:
      - 'gds-v*'

permissions:
  contents: read

concurrency:
  group: gds-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: go.sum
      - name: Prepare temporary runner tools and check ordinary user namespaces
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$(id -u)" -ne 0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          /usr/bin/bwrap --unshare-all --die-with-parent --new-session --clearenv --cap-drop ALL \
            --ro-bind /usr /usr --ro-bind /lib /lib --ro-bind /lib64 /lib64 \
            --symlink usr/bin /bin --proc /proc --dev /dev --tmpfs /tmp \
            /usr/bin/bash -euc '
              test "$(/usr/bin/id -u)" -ne 0
              test ! -e /dev/nvidiactl
              test ! -e /run
            '
      - name: Check exact GDS tag and CPU-only fixtures, then build reproducibly
        env:
          GDS_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go mod download
          go mod verify
          go test -race ./internal/distribution ./cmd/nido-dist
          make gds-release-check
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          ./scripts/public-audit.sh
      - name: Ordinary user native isolation without GPU or network
        run: |
          GOPROXY=off GOSUMDB=off go mod vendor -o "$RUNNER_TEMP/gds-vendor"
          NIDO_TEST_GDS_VENDOR="$RUNNER_TEMP/gds-vendor" \
          NIDO_TEST_GDS_OUTPUT="$RUNNER_TEMP/gds-native-evidence" \
          make check-gds-linux-native GO="$(command -v go)"
      - name: Install signing tool
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign, verify and publish only the independent GDS program
        env:
          CERTIFICATE_IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist/gds-linux-amd64 dist/gds-linux-amd64.sha256)
          files=()
          for asset in "${assets[@]}"; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
            cosign verify-blob "$asset" --bundle "${asset}.sigstore.json" \
              --certificate-identity "$CERTIFICATE_IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            files+=("$asset" "${asset}.sigstore.json")
          done
          gh release create "$RELEASE_TAG" "${files[@]}" --verify-tag --generate-notes --latest=false
